<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Dz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#0f2a1f;--card:#ffffff;--ink:#12261c;--muted:#5c6b63;--red:#d6303a;--line:#d9e0db}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:Cairo,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.logo{color:#fff;font-weight:800;font-size:2rem;margin:12px 0 4px}
.logo b{color:var(--red)}
.tag{color:#b9cbc0;margin:0 0 20px;text-align:center}
.card{background:var(--card);width:100%;max-width:420px;border-radius:14px;padding:20px}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{flex:1;background:none;border:0;padding:10px;font:600 1rem Cairo,sans-serif;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-color:var(--red)}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font:1rem Cairo,sans-serif;direction:ltr;text-align:right}
input:focus{outline:3px solid #9fd4b3;border-color:#2f7a4f}
.go{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:var(--red);color:#fff;font:800 1rem Cairo,sans-serif}
.go:disabled{opacity:.6}
.msg{margin-top:14px;padding:10px;border-radius:8px;font-size:.95rem;display:none}
.msg.err{display:block;background:#fde8ea;color:#8f1d27}
.msg.ok{display:block;background:#e3f4ea;color:#17562f}
.hi{font-size:1.4rem;font-weight:800;margin:0 0 6px}
.mail{color:var(--muted);direction:ltr;text-align:right;margin:0 0 18px}
.out{background:var(--ink)}
.card textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font:1rem Cairo,sans-serif;resize:vertical}
.card textarea:focus{outline:3px solid #9fd4b3;border-color:#2f7a4f}
#feed{margin-top:16px}
.post{border-top:1px solid var(--line);padding:12px 0}
.post .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.post .who{font-weight:800}
.post .when{color:var(--muted);font-size:.8rem}
.post .txt{margin:6px 0;white-space:pre-wrap;word-break:break-word}
.post .del{background:none;border:0;color:var(--red);font:600 .85rem Cairo,sans-serif;padding:0}
.empty{color:var(--muted);text-align:center;padding:12px 0}
.out{margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="logo">Mobile <b>Dz</b></div>
<p class="tag">شبكتك الاجتماعية الجزائرية</p>

<div class="card" id="auth">
  <div class="tabs">
    <button id="tLogin" class="on" type="button">دخول</button>
    <button id="tSignup" type="button">حساب جديد</button>
  </div>
  <div id="nameBox" hidden>
    <label for="name">الاسم الكامل</label>
    <input id="name" autocomplete="name">
  </div>
  <label for="email">البريد الإلكتروني</label>
  <input id="email" type="email" autocomplete="email">
  <label for="pass">كلمة السر</label>
  <input id="pass" type="password" autocomplete="current-password" placeholder="6 أحرف على الأقل">
  <button class="go" id="go" type="button">دخول</button>
  <div class="msg" id="msg"></div>
</div>

<div class="card" id="home" hidden>
  <p class="hi" id="hello"></p>
  <p class="mail" id="who"></p>
  <textarea id="postText" rows="3" maxlength="1000" placeholder="شنو يدور في بالك؟"></textarea>
  <button class="go" id="postBtn" type="button">نشر</button>
  <div class="msg" id="pmsg"></div>
  <div id="feed"></div>
  <button class="go out" id="logout" type="button">تسجيل الخروج</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://gmgzgxleptgioxhadxow.supabase.co";
const SUPABASE_KEY = "sb_publishable_6Rt5Qx5-ItGiF7PzkrAkhg_6wj072vz";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let mode = "login";
let me = null;

function setMode(m){
  mode = m;
  $("tLogin").classList.toggle("on", m === "login");
  $("tSignup").classList.toggle("on", m === "signup");
  $("nameBox").hidden = m === "login";
  $("go").textContent = m === "login" ? "دخول" : "إنشاء الحساب";
  $("pass").autocomplete = m === "login" ? "current-password" : "new-password";
  note("");
}
function note(text, ok){
  const el = $("msg");
  el.textContent = text;
  el.className = "msg" + (text ? (ok ? " ok" : " err") : "");
}
function explain(e){
  const t = (e.message || "").toLowerCase();
  if (t.includes("invalid login")) return "البريد أو كلمة السر غير صحيحة.";
  if (t.includes("already registered")) return "هذا البريد مسجّل من قبل. جرّب الدخول.";
  if (t.includes("password")) return "كلمة السر قصيرة. استعمل 6 أحرف على الأقل.";
  if (t.includes("email not confirmed")) return "أكّد بريدك أولا من الرسالة التي وصلتك.";
  if (t.includes("rate limit")) return "محاولات كثيرة. انتظر دقيقة وأعد المحاولة.";
  return "حدث خطأ: " + e.message;
}

async function showHome(user){
  me = user;
  $("auth").hidden = true;
  $("home").hidden = false;
  let name = user.user_metadata && user.user_metadata.full_name;
  try {
    const { data } = await sb.from("profiles").select("full_name").eq("id", user.id).maybeSingle();
    if (data && data.full_name) name = data.full_name;
  } catch (e) {}
  $("hello").textContent = "مرحبا " + (name || "بك") + " 👋";
  $("who").textContent = user.email;
  loadPosts();
}

async function loadPosts(){
  const feed = $("feed");
  const { data, error } = await sb.from("posts")
    .select("id,content,created_at,user_id,profiles(full_name)")
    .order("created_at", { ascending: false }).limit(50);
  feed.textContent = "";
  if (error) { feed.textContent = "تعذر تحميل المنشورات."; return; }
  if (!data.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "ما كاين حتى منشور. كن الأول!";
    feed.appendChild(e);
    return;
  }
  data.forEach(p => {
    const box = document.createElement("div");
    box.className = "post";
    const top = document.createElement("div");
    top.className = "top";
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = (p.profiles && p.profiles.full_name) || "مستخدم";
    const when = document.createElement("span");
    when.className = "when";
    when.textContent = new Date(p.created_at).toLocaleString("ar-DZ");
    top.append(who, when);
    const txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = p.content;
    box.append(top, txt);
    if (me && p.user_id === me.id) {
      const del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.textContent = "حذف";
      del.onclick = async () => {
        if (!confirm("تحذف هذا المنشور؟")) return;
        await sb.from("posts").delete().eq("id", p.id);
        loadPosts();
      };
      box.appendChild(del);
    }
    feed.appendChild(box);
  });
}

function pnote(t){
  const el = $("pmsg");
  el.textContent = t;
  el.className = "msg" + (t ? " err" : "");
}

$("postBtn").onclick = async () => {
  const content = $("postText").value.trim();
  if (!content) return pnote("اكتب شيئا قبل النشر.");
  $("postBtn").disabled = true;
  pnote("");
  const { error } = await sb.from("posts").insert({ user_id: me.id, content });
  $("postBtn").disabled = false;
  if (error) return pnote("تعذر النشر: " + error.message);
  $("postText").value = "";
  loadPosts();
};

$("tLogin").onclick = () => setMode("login");
$("tSignup").onclick = () => setMode("signup");

$("go").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("pass").value;
  if (!email || !password) return note("اكتب البريد وكلمة السر.");
  if (mode === "signup" && !$("name").value.trim()) return note("اكتب اسمك الكامل.");
  $("go").disabled = true;
  note("");
  try {
    if (mode === "login") {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      showHome(data.user);
    } else {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { full_name: $("name").value.trim() } }
      });
      if (error) throw error;
      if (data.session) showHome(data.user);
      else note("تم إنشاء الحساب. افتح بريدك واضغط على رابط التأكيد، ثم ادخل.", true);
    }
  } catch (e) {
    note(explain(e));
  }
  $("go").disabled = false;
};

$("logout").onclick = async () => {
  await sb.auth.signOut();
  $("home").hidden = true;
  $("auth").hidden = false;
  $("pass").value = "";
  setMode("login");
};

sb.auth.getSession().then(({ data }) => {
  if (data.session) showHome(data.session.user);
});
</script>
</body>
</html>
